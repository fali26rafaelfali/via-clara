name: Actualizar alertas DGT

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-alertas-dgt
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar incidencias activas
        run: node scripts/update-dgt.mjs

      - name: Publicar datos nuevos
        run: |
          if git diff --quiet -- public/dgt-incidents.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dgt-incidents.json
          git commit -m "Actualizar alertas DGT"
          git push
