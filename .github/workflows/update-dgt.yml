name: Actualizar incidencias DGT

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar y transformar DATEX II
        run: node scripts/update-dgt.mjs
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-dist
      - uses: actions/deploy-pages@v4
